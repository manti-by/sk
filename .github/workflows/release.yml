name: release

# Publishes a GitHub release when the package version in Cargo.toml changes on
# `master`. A manual `workflow_dispatch` re-runs the publish even without a
# version change, which is how a failed release is retried.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes to `master` must not race to publish the same tag. The lock is not
# cancelled once held, so an in-flight release always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt, clippy and tests
        run: make check

  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compare the `version` line in Cargo.toml with the same line at the
      # commit that was the ref before this push. An all-zero `before` means a
      # brand-new branch with no predecessor, which counts as a change.
      #
      # `BEFORE` and `EVENT_NAME` come in through `env:` rather than a direct
      # `${{ … }}` interpolation, per GitHub's script-injection hardening guide.
      - name: Detect a version bump
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          current=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)

          previous=''
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE:Cargo.toml" 2>/dev/null \
              | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              | head -n 1 || true)
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$current" != "$previous" ]; then
            changed=true
          else
            changed=false
          fi

          echo "Detected version $current (was '${previous:-none}'), changed=$changed"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: linux-aarch64
          # `macos-15-intel` is the current standard x86_64 macOS label. The old
          # `macos-13` was retired, so it must not be used.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/sk" "$staging/sk"
          for extra in README.md LICENSE LICENSE.md; do
            if [ -f "$extra" ]; then
              cp "$extra" "$staging/"
            fi
          done
          mkdir -p dist
          tar -czf "dist/sk-${VERSION}-${{ matrix.asset }}.tar.gz" -C "$staging" .

      - uses: actions/upload-artifact@v4
        with:
          name: sk-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sk-*
          merge-multiple: true

      # One aggregate checksums.txt for a human, plus a per-asset .sha256 that
      # install.sh downloads and verifies with `sha256sum -c`.
      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          for f in ./*.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done
          cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="v$VERSION"

          # A manual re-run must be able to repair a release whose creation
          # succeeded but whose asset upload failed, so an existing release is
          # updated in place rather than skipped.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; uploading any missing assets"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" \
              --target "$SHA" \
              --title "sk $tag" \
              --generate-notes \
              dist/*
          fi
