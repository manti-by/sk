name: ci

# Every push and every pull request runs the same gate as `make check`, so the
# release workflow can trust the tree it publishes. `install.sh` gets its own
# syntax check and an offline end-to-end smoke test here.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt, clippy and tests
        run: make check

      - name: Check shell syntax
        run: |
          sh -n install.sh
          for script in .github/scripts/*.sh; do bash -n "$script"; done

      - name: Lint shell
        run: .github/scripts/lint-shell.sh

      - name: Installer help
        run: ./install.sh --help

      - name: Installer smoke test
        run: .github/scripts/smoke-installer.sh
